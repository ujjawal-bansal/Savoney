server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the exact nginx version.
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss image/svg+xml;

  # Hashed asset filenames change whenever content changes, so they can be
  # cached indefinitely and never revalidated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached: it is the document that points at the
  # current asset hashes, so a stale copy pins users to an old build.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Proxy the API so the browser sees a single origin and the refresh cookie
  # stays first-party.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routing: unknown paths are React Router's to resolve, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
